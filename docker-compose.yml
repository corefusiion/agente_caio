# Somente Compose local; não usar com docker stack deploy/Swarm.
# Nenhuma integração é iniciada até ativar explicitamente o perfil agent.
services:
  caio-dashboard:
    profiles: ["agent"]
    build:
      context: ./dashboard
    depends_on:
      - caio-agent
    environment:
      CAIO_API_TOKEN: ${CAIO_API_TOKEN:?Defina CAIO_API_TOKEN com 32 bytes aleatórios em hexadecimal}
      CAIO_PROXY_BACKEND: caio-agent
      CAIO_PROXY_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=false"

  caio-agent:
    profiles: ["agent"]
    build:
      context: .
    command: ["gateway"]
    environment:
      CAIO_API_TOKEN: ${CAIO_API_TOKEN:?Defina CAIO_API_TOKEN com 32 bytes aleatórios em hexadecimal}
      CAIO_EVOLUTION_WEBHOOK_TOKEN: ${CAIO_EVOLUTION_WEBHOOK_TOKEN:-}
      # Opcional, somente no servidor; nunca no dashboard ou no config JSON.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    ports:
      - "127.0.0.1:18790:18790"
    volumes:
      - caio_workspace:/home/caio/.caiocore/workspace
      # Criar e proteger o arquivo antes de ativar o perfil; nunca usar o exemplo sem revisão.
      - type: bind
        source: ${CAIO_CONFIG_FILE:-../caio-config/config.json}
        target: /home/caio/.caiocore/config.json
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=false"

volumes:
  caio_workspace:
